header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:1.45rem;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:.9rem;margin:2px 0 0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:500}
.btn.dng{color:var(--s-sick)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:6px;padding:10px 12px;text-align:start;cursor:pointer;width:100%}
.stat[aria-pressed="true"]{outline:2px solid var(--c)}
.stat b{display:block;font-size:1.6rem;line-height:1.2;color:var(--c)}
.stat span{color:var(--mute);font-size:.88rem}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1 1 220px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--mute);font-size:.88rem;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
tr:last-child td{border-bottom:0}
.name{font-weight:500}.small{color:var(--mute);font-size:.85rem}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:500;color:var(--c);border:1px solid var(--c)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.row-act{display:flex;gap:6px}
.row-act .btn{padding:4px 10px;font-size:.85rem}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0;width:min(540px,92vw);max-height:80vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:18px;display:grid;gap:12px}
form h2{margin:0;font-size:1.1rem}
label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}
label input,label select,label textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}h3{margin:14px 0 8px;font-size:.95rem;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px}label input[readonly]{opacity:.75}label input:disabled{opacity:.5}
.foot{display:flex;gap:8px;justify-content:flex-start;margin-top:4px}
@media (max-width:640px){.g{grid-template-columns:1fr 1fr}}@media (max-width:420px){.g{grid-template-columns:1fr}}
[hidden]{display:none!important}
.who{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--mute);font-weight:700}
.photo{display:flex;gap:14px;align-items:center}
.frame{width:80px;height:100px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:.8rem;text-align:center;background:var(--bg)}
.frame img{width:100%;height:100%;object-fit:cover}
.pact{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.locked .wrap{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#lf{background:transparent;border:0;border-radius:8px;width:min(360px,100%);text-shadow:0 0 6px var(--bg),0 0 3px var(--bg)}
#lf h2,#lf label,#lf .small{color:var(--ink)}
#lf .btn{background:var(--panel)}
#lf .btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);text-shadow:none;font-weight:700;padding:12px}
.err{color:var(--s-sick);margin:0;min-height:1.4em;font-size:.9rem}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:flex-start;gap:12px;background:var(--panel);margin:-18px -18px 0;padding:12px 18px;border-bottom:1px solid var(--line)}
.x{width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:1.1rem;line-height:1;cursor:pointer;color:var(--ink)}
.x:hover{color:var(--s-sick);border-color:var(--s-sick)}
.x:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

:root[data-theme="dark"]{--veil:rgba(14,23,29,.6)}
body,#lock{background-color:var(--bg);background-image:linear-gradient(var(--veil),var(--veil)),var(--camo);background-size:auto,640px 410px;background-repeat:no-repeat,repeat}
header{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
#note{display:inline-block;background:color-mix(in srgb,var(--panel) 90%,transparent);padding:6px 10px;border-radius:6px}
.hl{display:flex;align-items:center;gap:12px}
.embh{width:74px;height:60px;flex:none;background:var(--emb) center/contain no-repeat}
img.av,#pv{cursor:zoom-in}
dialog#lb{width:auto;max-height:none;overflow:visible;background:transparent;border:0;padding:0;max-width:94vw}
dialog#lb::backdrop{background:rgba(0,0,0,.75)}
.lbbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.lbbox .x{position:absolute;top:-14px;right:-14px;z-index:2;background:var(--panel)}
#lbimg{display:block;width:min(86vw,400px);height:auto;max-height:76vh;object-fit:contain;border-radius:4px}
#lbcap{margin-top:8px;font-weight:500}
.nm{background:none;border:0;padding:0;font:inherit;font-weight:500;color:var(--brand);cursor:pointer;text-align:start}
.nm:hover{text-decoration:underline}
.nm:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
.pbody{padding:18px;display:grid;gap:10px}
.pbody .dh{margin:-18px -18px 0}
.pphoto{display:flex;gap:14px;align-items:center}
.pphoto .frame img{cursor:zoom-in}
.pfn{font-size:1.15rem;font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.pg>div{min-width:0}
.pg .pw{grid-column:1/-1}
.pg b{display:block;font-weight:400;color:var(--mute);font-size:.82rem}
.pg span{display:block;overflow-wrap:anywhere;white-space:pre-wrap}
@media (max-width:420px){.pg{grid-template-columns:1fr}}
#pfd{margin-inline-start:auto}
.rv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rv .btn{flex:none}
tr.gh td{background:color-mix(in srgb,var(--brand) 16%,var(--panel));color:var(--brand);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line)}
tr.gh b{display:inline-block;margin-inline-start:10px;min-width:1.6em;text-align:center;padding:0 8px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-size:.85rem;font-weight:500}
.specbox{display:grid;grid-template-columns:1fr 1fr;margin-bottom:16px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--panel) 88%,transparent)}
.spb{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 8px;border:0;background:transparent;font-weight:500;cursor:pointer;color:var(--ink)}
.spl{width:30px;height:30px;flex:none;color:var(--brand)}
.spb[aria-pressed="true"] .spl{color:var(--brand-ink)}
.spb+.spb{border-inline-start:1px solid var(--line)}
.spb b{min-width:1.9em;text-align:center;padding:0 8px;border-radius:999px;background:var(--line);font-size:.9rem;font-weight:500}
.spb[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.spb[aria-pressed="true"] b{background:var(--brand-ink);color:var(--brand)}
.spb:focus-visible{outline:2px solid var(--brand);outline-offset:-4px}
</style>
</head>

<dialog id="rcv" aria-label="المحذوفون">
  <div class="pbody">
    <div class="dh"><button type="button" class="x" id="rcvx" aria-label="إغلاق النافذة" title="إغلاق">✕</button><h2>المحذوفون</h2></div>
    <p class="small" id="rcvh" style="margin:0"></p>
    <div id="rcvl"></div>
  </div>
</dialog>
<dialog id="lb" aria-label="عرض الصورة">
  <div class="lbbox">
    <button type="button" class="x" id="lbx" aria-label="إغلاق">✕</button>
    <img id="lbimg" alt="صورة الفرد">
    <div id="lbcap"></div>
  </div>
</dialog>
<dialog id="dlg">
  <form id="f" method="dialog" onsubmit="return false">
    <div class="dh"><button type="button" class="x" id="xcl" aria-label="إغلاق النافذة" title="إغلاق">✕</button><h2 id="ft">إضافة فرد</h2></div>
    <div class="photo">
      <div class="frame"><img id="pv" alt="صورة الفرد" hidden><span id="pph">لا توجد صورة</span></div>
      <div class="pact">
        <input type="file" id="pf" accept="image/*" hidden>
        <button type="button" class="btn" id="pbtn">اختيار صورة</button>
        <button type="button" class="btn dng" id="prm">إزالة الصورة</button>
        <span class="small">تُصغَّر الصورة تلقائيًا قبل الحفظ.</span>
      </div>
    </div>
    <div id="fg"></div>
    <div class="foot">
      <button type="button" class="btn pri" id="save">حفظ</button>
      <button type="button" class="btn" id="cancel">إلغاء</button>
    </div>
  </form>
</dialog>

<script>
const STATUS=[
 {k:'present',t:'حاضر',c:'var(--s-present)'},
 {k:'mission',t:'مهمة',c:'var(--s-mission)'},
 {k:'leave',t:'إجازة',c:'var(--s-leave)'},
 {k:'course',t:'تدريب',c:'var(--s-course)'},
 {k:'absent',t:'غياب',c:'var(--s-absent)'},
 {k:'bare',t:'عرية',c:'var(--s-bare)'},
 {k:'medrest',t:'راحة طبية',c:'var(--s-medrest)'},
 {k:'flee',t:'هروب',c:'var(--s-flee)'}];
const SPECS=['مراسل','مصلح','إشارة','معلوماتية'];
const KEY='esc1-personnel-v1';
const $=s=>document.querySelector(s);
let data=[],filter='all',editId=null,memOnly=false;

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){memOnly=true}return null}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){memOnly=true}note()}
function note(){$('#note').textContent=memOnly?'تعذّر الحفظ في هذا المتصفح؛ البيانات مؤقتة حتى إغلاق الصفحة.':'تُحفظ البيانات تلقائيًا في هذا المتصفح فقط. استخدم «نسخ احتياطي» للاحتفاظ بنسخة.'}
const st=k=>STATUS.find(s=>s.k===k)||STATUS[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function renderStats(){
  const cnt=k=>data.filter(p=>p.st===k).length;
  $('#stats').innerHTML=
   `<button class="stat" style="--c:var(--brand)" data-f="all" aria-pressed="${filter==='all'}"><b>${data.length}</b><span>العدد الكلي</span></button>`+
   STATUS.map(s=>`<button class="stat" style="--c:${s.c}" data-f="${s.k}" aria-pressed="${filter===s.k}"><b>${cnt(s.k)}</b><span>${s.t}</span></button>`).join('');
}
const nd=v=>String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function render(){
  renderStats();
  const q=nd($('#q').value.trim());
  const list=data.filter(p=>(filter==='all'||p.st===filter)&&(!q||[p.name,p.surname,p.rank,p.note,p.milId,p.phone].some(v=>nd(v).includes(q))));
  $('#empty').hidden=list.length>0;
  const rowH=p=>{const s=st(p.st);return `<tr>
   <td><div class="who">${p.photo?`<img class="av" src="${p.photo}" alt="" data-n="${esc(p.rank+' '+p.name+' '+p.surname)}" title="اضغط لتكبير الصورة">`:`<span class="av">${esc((p.name||"؟").charAt(0))}</span>`}<div><div class="name"><button type="button" class="nm" data-v="${p.id}" title="اضغط لعرض بيانات الفرد">${esc(p.name)} ${esc(p.surname)}</button></div><div class="small">${esc(p.rank)}${p.milId?"، رقم "+esc(p.milId):""}</div></div></div></td>
   <td><select class="quick" data-id="${p.id}" aria-label="تغيير الحالة" style="--c:${s.c}">${STATUS.map(o=>`<option value="${o.k}" ${o.k===p.st?'selected':''}>${o.t}</option>`).join('')}</select></td>
   <td>${esc(p.note)||'<span class="small">—</span>'}</td>
   </tr>`};
  $('#rows').innerHTML=list.map(rowH).join('');
  updRcv();
}
const MAR=['أعزب','متزوج'];
const SEC=[
['الهوية',[{id:'name',l:'الاسم',r:1},{id:'surname',l:'اللقب',r:1},{id:'rank',l:'الرتبة',r:1},{id:'milId',l:'الرقم العسكري'},{id:'bdate',l:'تاريخ الميلاد',t:'date'},{id:'bplace',l:'مكان الميلاد'},]],
['الحالة العائلية',[{id:'marital',l:'الحالة الإجتماعية',sel:MAR},{id:'mdate',l:'تاريخ الزواج',t:'date'},{id:'boys',l:'عدد الذكور',t:'number'},{id:'girls',l:'عدد الإناث',t:'number'},{id:'kids',l:'العدد الكلي للأولاد',ro:1}]],
['البطاقات والاتصال',[{id:'cardMil',l:'رقم البطاقة العسكرية'},{id:'phone',l:'رقم الهاتف',t:'tel'},{id:'addr',l:'العنوان',w:1}]],
['المسار المهني',[{id:'edate',l:'تاريخ الإكتتاب',t:'date'},]],
['العقوبات والإجازات',[{id:'penCount',l:'عدد العقوبات',t:'number'},{id:'penReason',l:'سبب العقوبات',ta:1,w:1},{id:'penDate',l:'تاريخ التوقيف (التواريخ إن تعددت)',ta:1,w:1},{id:'leaveCount',l:'عدد الإجازات',t:'number'},{id:'leaveDates',l:'تواريخ الإجازات',ta:1,w:1}]],
['الحالة الحالية',[{id:'st',l:'الحالة',sel:STATUS.map(s=>[s.k,s.t])},{id:'ret',l:'العودة المتوقعة',t:'date'},{id:'note',l:'المجموعة',ta:1,w:1}]]
];
const ALL=SEC.flatMap(s=>s[1]);
const inp=f=>f.t==='number'?`<input id="f_${f.id}" type="number" min="0" step="1">`:f.sel?`<select id="f_${f.id}">${f.sel.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return `<option value="${v}">${t}</option>`}).join('')}</select>`:f.ta?`<textarea id="f_${f.id}" rows="2"></textarea>`:`<input id="f_${f.id}" type="${f.t||'text'}" ${f.r?'required':''} ${f.ro?'readonly':''}>`;
$('#fg').innerHTML=SEC.map(([h,fs])=>`<h3>${h}</h3><div class="g">${fs.map(f=>`<label class="${f.w?'wide':''}">${f.l}${inp(f)}</label>`).join('')}</div>`).join('');
const $f=id=>$('#f_'+id);
const yrs=d=>{if(!d)return'';const b=new Date(d),n=new Date();let y=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))y--;return y>=0?y:''};
const span=d=>{if(!d)return'';const b=new Date(d),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0)return'';const y=Math.floor(m/12),o=m%12,t=[];if(y)t.push(y+' سنة');if(o)t.push(o+' شهر');return t.length?t.join(' و '):'أقل من شهر'};
function calc(){$f('kids').value=(+$f('boys').value||0)+(+$f('girls').value||0);$f('mdate').disabled=$f('marital').value!=='متزوج'}
['marital','boys','girls'].forEach(i=>$f(i).addEventListener('input',calc));
let photo='';
function saveFile(name,mime,text){
  if(window.AndroidSave){AndroidSave.save(name,mime,btoa(unescape(encodeURIComponent(text))));return}
  const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.saveFile;
  if(h){h.postMessage({name:name,text:text});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();
}
function showPhoto(){$('#pv').hidden=!photo;$('#pph').hidden=!!photo;if(photo)$('#pv').src=photo}
$('#pbtn').onclick=()=>$('#pf').click();
$('#prm').onclick=()=>{photo='';showPhoto()};
$('#pf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.82);showPhoto()};
    im.onerror=()=>alert('تعذّر قراءة الصورة. اختر ملف صورة صالحًا (JPG أو PNG).');
    im.src=r.result};
  r.readAsDataURL(f);
};
function openForm(id){
  editId=id;const p=data.find(x=>x.id===id)||{};
  $('#ft').textContent=id?'تعديل بيانات الفرد':'إضافة فرد';
  ALL.forEach(f=>{const e=$f(f.id);e.value=p[f.id]??(f.sel?e.options[0].value:'')});
  photo=p.photo||'';showPhoto();calc();$('#dlg').showModal();
}
const lb=document.getElementById('lb');
function openLb(src,cap){document.getElementById('lbimg').src=src;document.getElementById('lbcap').textContent=(cap||'').trim();lb.showModal()}
lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('#lbx'))lb.close()});
$('#pv').onclick=()=>{if(photo)openLb(photo,$f('rank').value+' '+$f('name').value+' '+$f('surname').value)};
$('#add').onclick=()=>openForm(null);
$('#cancel').onclick=()=>$('#dlg').close();
$('#xcl').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{
  if(!$('#f').reportValidity())return;
  const rec={photo};ALL.forEach(f=>{const e=$f(f.id);rec[f.id]=e.disabled?'':e.value.trim()});
  if(editId)Object.assign(data.find(x=>x.id===editId),rec);else data.push({id:Date.now().toString(36),...rec});
  persist();render();$('#dlg').close();
};
$('#stats').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}};
$('#q').oninput=render;
const fd=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(v||'')};
let viewId=null;
function viewP(id){
  const p=data.find(x=>x.id===id);if(!p)return;viewId=id;
  const full=[p.rank,p.name,p.surname].filter(Boolean).join(' ');
  $('#pft').textContent='بيانات الفرد';$('#pfn').textContent=[p.name,p.surname].filter(Boolean).join(' ');
  $('#pfr').textContent=[p.rank,p.milId?'الرقم العسكري '+p.milId:''].filter(Boolean).join('، ');
  const s=st(p.st);$('#pfs').textContent=s.t;$('#pfs').style.setProperty('--c',s.c);
  $('#pfimg').hidden=!p.photo;$('#pfph').hidden=!!p.photo;if(p.photo)$('#pfimg').src=p.photo;
  const val=f=>{
    if(f.id==='age')return yrs(p.bdate);
    if(f.id==='years')return span(p.pdate);
    if(f.id==='st')return st(p.st).t;
    if(f.id==='kids')return (p.boys||p.girls)?String((+p.boys||0)+(+p.girls||0)):(p.kids||'');
    return f.t==='date'?fd(p[f.id]):(p[f.id]??'');
  };
  $('#pfb').innerHTML=SEC.map(([h,fs])=>`<h3>${h}</h3><div class="pg">${fs.map(f=>{const v=String(val(f)??'').trim();return `<div class="${f.w||f.ta?'pw':''}"><b>${f.l}</b><span>${v?esc(v):'—'}</span></div>`}).join('')}</div>`).join('');
  $('#pview').showModal();$('#pview').scrollTop=0;
}
$('#pfx').onclick=$('#pfc').onclick=()=>$('#pview').close();
const missingSeed=()=>SEED.filter(x=>!data.some(p=>String(p.milId)===String(x.milId))&&!trash.some(p=>String(p.milId)===String(x.milId)));
function updRcv(){const n=trash.length+missingSeed().length;$('#rcvb').textContent=n?'المحذوفون ('+n+')':'المحذوفون'}
function fillRcv(){
  const row=(p,attr,note)=>`<div class="rv"><div class="who">${p.photo?`<img class="av" src="${p.photo}" alt="" style="cursor:default">`:`<span class="av">${esc((p.name||'؟').charAt(0))}</span>`}<div><div class="name">${esc([p.name,p.surname].filter(Boolean).join(' '))}</div><div class="small">${esc(p.rank||'')}${p.milId?'، رقم '+esc(p.milId):''}${note?' · '+note:''}</div></div></div><button type="button" class="btn pri" ${attr}>استرجاع</button></div>`;
  const ms=missingSeed();
  let h='';
  if(trash.length)h+='<h3>حُذفوا من التطبيق</h3>'+trash.map(p=>row(p,'data-rt="'+esc(p.id)+'"','حُذف '+fd((p.deletedAt||'').slice(0,10)))).join('');
  if(ms.length)h+='<h3>من البيانات الأصلية المستوردة</h3>'+ms.map(p=>row(p,'data-rs="'+esc(String(p.milId))+'"','بياناته الأصلية')).join('');
  $('#rcvh').textContent=(trash.length||ms.length)?'اضغط «استرجاع» لإعادة الفرد إلى القائمة. الاسترجاع من البيانات الأصلية يعيد النسخة المستوردة دون تعديلاتك عليه.':'';
  $('#rcvl').innerHTML=h||'<div class="empty">لا يوجد أفراد محذوفون.</div>';
}
$('#rcvb').onclick=()=>{fillRcv();$('#rcv').showModal()};
$('#rcvx').onclick=()=>$('#rcv').close();
$('#rcvl').onclick=e=>{
  const b=e.target.closest('[data-rt],[data-rs]');if(!b)return;
  if(b.dataset.rt){const i=trash.findIndex(x=>x.id===b.dataset.rt);if(i<0)return;const r=trash.splice(i,1)[0];delete r.deletedAt;data.push(r);saveTrash()}
  else{const r=SEED.find(x=>String(x.milId)===b.dataset.rs);if(!r)return;data.push(JSON.parse(JSON.stringify(r)))}
  persist();render();fillRcv();
};
$('#pfd').onclick=()=>{
  const p=data.find(x=>x.id===viewId);if(!p)return;
  const nm=[p.rank,p.name,p.surname].filter(Boolean).join(' ');
  if(!confirm('حذف «'+nm+'» من القائمة؟ سيُنقل إلى «المحذوفون» ويمكنك استرجاعه منها.'))return;
  trash.unshift({...p,deletedAt:new Date().toISOString()});trash=trash.slice(0,100);saveTrash();
  data=data.filter(x=>x.id!==viewId);persist();render();$('#pview').close();viewId=null;
};
$('#pfe').onclick=()=>{const id=viewId;$('#pview').close();openForm(id)};
$('#pfimg').onclick=()=>{const p=data.find(x=>x.id===viewId);if(p&&p.photo)openLb(p.photo,[p.rank,p.name,p.surname].filter(Boolean).join(' '))};
$('#rows').onclick=e=>{
  const nv=e.target.closest('[data-v]');if(nv)return viewP(nv.dataset.v);
  const im=e.target.closest('img.av');if(im)return openLb(im.src,im.dataset.n);
};
$('#rows').onchange=e=>{
  if(e.target.matches('.quick')){data.find(x=>x.id===e.target.dataset.id).st=e.target.value;persist();render()}
};
/* ===== تصدير PDF (بدون مكتبات، يعمل دون إنترنت) ===== */
const PW=1240,PH=1754,PM=70,PF='"Segoe UI",Tahoma,Arial,"Noto Naskh Arabic",sans-serif';
const PC={brand:'#0b4f6c',ink:'#14232e',mute:'#5c6e7b',line:'#d3dce3',soft:'#f1f5f8'};
function pdfDoc(){
  const pages=[];let cv,cx,y=0;
  const fnt=(w,s)=>w+' '+s+'px '+PF;
  function page(){cv=document.createElement('canvas');cv.width=PW;cv.height=PH;cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,PW,PH);cx.direction='rtl';cx.textBaseline='alphabetic';pages.push(cv);y=PM;return cx}
  function wrap(t,mw,f){cx.font=f;const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{const tr=line?line+' '+w:w;if(line&&cx.measureText(tr).width>mw){out.push(line);line=w}else line=tr});out.push(line)});return out}
  function txt(t,x,yy,f,col,al){cx.font=f;cx.fillStyle=col;cx.textAlign=al||'right';cx.fillText(t,x,yy)}
  function fit(t,mw,f){cx.font=f;t=String(t);if(cx.measureText(t).width<=mw)return t;while(t.length>1&&cx.measureText(t+'…').width>mw)t=t.slice(0,-1);return t+'…'}
  return {pages,page,wrap,txt,fit,fnt,get cx(){return cx},get y(){return y},set y(v){y=v}};
}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function drawCover(cx,im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;cx.save();cx.beginPath();cx.rect(x,y,w,h);cx.clip();cx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);cx.restore()}
function pdfHeader(D,sub){
  const cx=D.cx;cx.fillStyle=PC.brand;cx.fillRect(0,0,PW,150);
  D.txt('ESC1',PW-PM,72,D.fnt('bold',44),'#fff');
  D.txt(sub,PW-PM,120,D.fnt('normal',28),'#d6e6ee');
  D.txt('تاريخ التصدير: '+fd(new Date().toISOString().slice(0,10)),PM,120,D.fnt('normal',24),'#d6e6ee','left');
  D.y=190;
}
function pdfFooters(D){const n=D.pages.length;D.pages.forEach((c,i)=>{const x=c.getContext('2d');x.direction='rtl';x.textAlign='center';x.font=D.fnt('normal',22);x.fillStyle=PC.mute;x.fillText('صفحة '+(i+1)+' / '+n,PW/2,PH-34)})}
const pval=(p,f)=>{
  if(f.id==='age')return yrs(p.bdate);if(f.id==='years')return span(p.pdate);if(f.id==='st')return st(p.st).t;
  if(f.id==='kids')return (p.boys||p.girls)?String((+p.boys||0)+(+p.girls||0)):(p.kids||'');
  return f.t==='date'?fd(p[f.id]):(p[f.id]??'');
};
async function personDoc(p){
  const D=pdfDoc();let cx=D.page();pdfHeader(D,'بطاقة بيانات الفرد');
  const top=D.y,ph=270,pw=220,px=PW-PM-pw;
  cx.fillStyle=PC.soft;cx.fillRect(px,top,pw,ph);
  const im=p.photo?await loadImg(p.photo):null;
  if(im)drawCover(cx,im,px,top,pw,ph);else D.txt((p.name||'؟').charAt(0),px+pw/2,top+ph/2+30,D.fnt('bold',90),PC.mute,'center');
  cx.strokeStyle=PC.line;cx.lineWidth=2;cx.strokeRect(px,top,pw,ph);
  const rx=px-40;
  D.txt([p.name,p.surname].filter(Boolean).join(' '),rx,top+70,D.fnt('bold',50),PC.ink);
  D.txt([p.rank,p.milId?'الرقم العسكري '+p.milId:''].filter(Boolean).join('، '),rx,top+128,D.fnt('normal',32),PC.mute);
  const s=st(p.st);cx.font=D.fnt('bold',28);const sw=cx.measureText(s.t).width+50;
  cx.fillStyle=s.c;cx.beginPath();cx.roundRect?cx.roundRect(rx-sw,top+160,sw,52,26):cx.rect(rx-sw,top+160,sw,52);cx.fill();
  D.txt(s.t,rx-sw/2,top+198,D.fnt('bold',28),'#fff','center');
  D.y=top+ph+36;
  const colW=(PW-2*PM-40)/2,xR=PW-PM,xL=PW-PM-colW-40;
  const lf=D.fnt('normal',21),vf=D.fnt('bold',26);
  const meas=(f,w)=>{const v=String(pval(p,f)??'').trim()||'—';const ls=D.wrap(v,w,vf);return {f,v,ls,h:50+ls.length*34}};
  SEC.forEach(([h,fs])=>{
    const items=fs.map(f=>meas(f,(f.w||f.ta)?PW-2*PM:colW));
    const rows=[];let pend=null;
    items.forEach(it=>{if(it.f.w||it.f.ta){if(pend){rows.push([pend]);pend=null}rows.push([it])}else if(pend){rows.push([pend,it]);pend=null}else pend=it});
    if(pend)rows.push([pend]);
    if(!rows.length)return;
    const need=60+Math.max(...rows[0].map(i=>i.h));
    if(D.y+need>PH-PM-40){D.page();D.y=PM}
    cx=D.cx;cx.fillStyle=PC.brand;cx.fillRect(PM,D.y,PW-2*PM,46);
    D.txt(h,PW-PM-18,D.y+33,D.fnt('bold',26),'#fff');D.y+=46+10;
    rows.forEach(r=>{
      const rh=Math.max(...r.map(i=>i.h));
      if(D.y+rh>PH-PM-40){D.page();D.y=PM}
      cx=D.cx;
      r.forEach((it,k)=>{
        const wide=it.f.w||it.f.ta;const x=wide?xR:(k===0?xR:xL),w=wide?PW-2*PM:colW;
        cx.fillStyle=PC.soft;cx.fillRect(x-w,D.y,w,rh-6);
        D.txt(it.f.l,x-14,D.y+30,lf,PC.mute);
        it.ls.forEach((l,j)=>D.txt(l,x-14,D.y+30+34*(j+1),vf,it.v==='—'?PC.mute:PC.ink));
      });
      D.y+=rh;
    });
    D.y+=8;
  });
  pdfFooters(D);return D;
}
function rosterDoc(){

  D.txt(sc,PW-PM,D.y+62,D.fnt('normal',25),PC.mute);D.y+=100;

  const head=()=>{cx=D.cx;cx.fillStyle=PC.brand;cx.fillRect(PM,D.y,PW-2*PM,54);let x=PW-PM;cols.forEach(([t,w])=>{D.txt(t,x-12,D.y+37,D.fnt('bold',25),'#fff');x-=w});D.y+=54};
  head();

    if(D.y+58>PH-PM-50){D.page();head()}

    const cells=[n+1,[p.rank,p.name,p.surname].filter(Boolean).join(' '),p.milId||'',st(p.st).t,p.phone||'',String(p.note||'').split('\n')[0].replace(/^(الوحدة|المجموعة):\s*/,'')];
    let x=PW-PM;cols.forEach(([t,w],i)=>{D.txt(D.fit(cells[i],w-20,D.fnt('normal',25)),x-12,D.y+37,D.fnt('normal',25),PC.ink);x-=w});
    cx.strokeStyle=PC.line;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(PM,D.y+58);cx.lineTo(PW-PM,D.y+58);cx.stroke();D.y+=58;
  });
  pdfFooters(D);return D;
}
function makePDF(jp){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(i,body,stream)=>{offs[i]=len;add(i+' 0 obj\n'+body+'\n');if(stream){add('stream\n');add(stream);add('\nendstream\n')}add('endobj\n')};
  const n=jp.length;add('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Count '+n+'/Kids ['+jp.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>');
  jp.forEach((j,i)=>{const pg=3+i*3,ct=pg+1,im=pg+2,c='q 595.28 0 0 841.89 0 0 cm /I'+i+' Do Q';
    obj(pg,'<</Type/Page/Parent 2 0 R/MediaBox [0 0 595.28 841.89]/Resources<</XObject<</I'+i+' '+im+' 0 R>>>>/Contents '+ct+' 0 R>>');
    obj(ct,'<</Length '+c.length+'>>',enc.encode(c));
    obj(im,'<</Type/XObject/Subtype/Image/Width '+j.w+'/Height '+j.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.b.length+'>>',j.b)});
  const total=3+n*3,x=len;
  add('xref\n0 '+total+'\n0000000000 65535 f \n'+offs.slice(1,total).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  add('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
async function docToPDF(D){
  const jp=[];
  for(const c of D.pages){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));jp.push({b:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height})}
  return makePDF(jp);
}
async function savePDF(name,blob){
  if(window.AndroidSave){const r=new FileReader();r.onload=()=>AndroidSave.save(name,'application/pdf',String(r.result).split(',')[1]);r.readAsDataURL(blob);return}
  const f=new File([blob],name,{type:'application/pdf'});
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(ios&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove()},3000);
}

  btn.disabled=false;btn.textContent=t;
}

const b64=u=>btoa(String.fromCharCode(...u));
function sha256(m){
  const u=new TextEncoder().encode(m),l=u.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(u);b[l]=128;
  const dv=new DataView(b.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  const K=[],H=[];
  for(let c=2,k=0;k<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d===0){p=0;break}if(p){if(k<8)H[k]=Math.floor((c**.5%1)*4294967296);K[k++]=Math.floor((c**(1/3)%1)*4294967296)}}
  const W=new Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let i=0;i<n;i+=64){
    for(let t=0;t<16;t++)W[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const a=W[t-15],e=W[t-2];W[t]=(W[t-16]+(r(a,7)^r(a,18)^(a>>>3))+W[t-7]+(r(e,17)^r(e,19)^(e>>>10)))|0}
    let [a,b2,c2,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[t]+W[t])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c2)^(b2&c2)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0}
    [a,b2,c2,d,e,f,g,h].forEach((v,j)=>{H[j]=(H[j]+v)|0});
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function hp(pin,salt){
  if(!(window.crypto&&crypto.subtle)){let h=salt+pin;for(let i=0;i<5000;i++)h=sha256(h+pin);return h}
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},k,256);
  return b64(new Uint8Array(bits));
}
function show(m){
  mode=m;L('lock').hidden=false;document.body.classList.add('locked');
  if($('#dlg').open)$('#dlg').close();
  L('lt').textContent={setup:'إنشاء رمز الدخول',unlock:'أدخل رمز الدخول',change:'تغيير رمز الدخول'}[m];
  L('lh').textContent={setup:'اختر رمزًا من 4 أرقام على الأقل. سيُطلب عند كل فتح للتطبيق.',unlock:'خلية أنظمة المعلومات والاتصال',change:'أدخل الرمز الحالي ثم الرمز الجديد.'}[m];
  L('l_cur').hidden=m==='setup';L('l_new').hidden=m==='unlock';L('l_rep').hidden=m==='unlock';
  L('lcancel').hidden=m!=='change';L('lforgot').hidden=m==='setup';
  L('lgo').textContent=m==='unlock'?'دخول':'حفظ الرمز';
  const un=m==='unlock';L('lt').hidden=un;L('lh').hidden=un;L('lgo').hidden=false;
  L('l_cur').firstChild.nodeValue=un?'رمز الدخول':'الرمز الحالي';
  ['p_cur','p_new','p_rep'].forEach(i=>L(i).value='');L('le').textContent='';
  (m==='setup'?L('p_new'):L('p_cur')).focus();
}
function unlockUI(){L('lock').hidden=true;document.body.classList.remove('locked')}
async function go(){
  const err=t=>{L('le').textContent=t};
  const cur=L('p_cur').value,nw=L('p_new').value,rp=L('p_rep').value;
  if(mode!=='setup'){
    if(Date.now()<until)return err('محاولات كثيرة. انتظر '+Math.ceil((until-Date.now())/1000)+' ثانية.');
    if(!cur)return err('أدخل الرمز.');
    if(await hp(cur,rec.salt)!==rec.hash){fails++;if(fails>=5){fails=0;until=Date.now()+30000;return err('محاولات كثيرة. انتظر 30 ثانية.')}return err('الرمز غير صحيح.')}
    fails=0;
    if(mode==='unlock'){if(!rec.len){rec.len=cur.length;try{localStorage.setItem(PK,JSON.stringify(rec))}catch(e){}}return unlockUI()}
  }
  if(!/^\d{4,}$/.test(nw))return err('الرمز يجب أن يتكوّن من 4 أرقام على الأقل.');
  if(nw!==rp)return err('الرمزان غير متطابقين.');
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  rec={salt,hash:await hp(nw,salt),len:nw.length};
  try{localStorage.setItem(PK,JSON.stringify(rec))}catch(e){}
  unlockUI();
}
L('lf').addEventListener('submit',e=>{e.preventDefault();go()});

  const err=t=>{L('le').textContent=t};

  fails=0;L('le').textContent='';return true;
}
